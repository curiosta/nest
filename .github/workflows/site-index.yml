# Rebuilds /site-index.json (the "Ask NEST" chat widget's search index) whenever page HTML changes on main,
# and commits it back so GitHub Pages ("Deploy from a branch": main, /) publishes it with the site.
#
# No loop: the commit is pushed with the workflow's GITHUB_TOKEN, and GitHub never starts a new workflow run
# from a GITHUB_TOKEN push. As belt and braces the trigger only watches *.html and this tooling (never
# site-index.json), and the job ignores pushes made by github-actions[bot].
# The Pages build itself IS triggered by a GITHUB_TOKEN push, so the new index goes live automatically.
# We deliberately do NOT put "[skip ci]" in the message: that can also skip the "pages build and deployment" run.
name: Chat site index

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - ".github/scripts/build-site-index.mjs"
      - ".github/workflows/site-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-site-index
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build site-index.json (Node is preinstalled on the runner; no npm dependencies)
        run: |
          node --version
          node .github/scripts/build-site-index.mjs . --base / --out site-index.json \
            --prefer main --drop-sections comments --anchors --no-timestamp --skip docs,assets,handoff,ai,out,proxy,verify
      - name: Commit if it changed
        run: |
          if git ls-files --error-unmatch site-index.json >/dev/null 2>&1 && git diff --quiet -- site-index.json; then
            echo "site-index.json unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-index.json
          git commit -m "Chat: rebuild site-index.json for ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "push rejected (main moved); rebasing and retrying ($i)"
            git pull --rebase origin main
          done
          exit 1
